<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#98D8C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4037;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tractorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E65100" />
      <stop offset="100%" style="stop-color:#BF360C" />
    </linearGradient>
  </defs>

  <!-- Ciel -->
  <rect width="1200" height="800" fill="url(#skyGrad)" />

  <!-- Soleil -->
  <circle cx="950" cy="130" r="70" fill="#FFD700" opacity="0.85"/>
  <circle cx="950" cy="130" r="55" fill="#FFF176" opacity="0.6"/>

  <!-- Nuages -->
  <ellipse cx="200" cy="100" rx="90" ry="40" fill="white" opacity="0.7"/>
  <ellipse cx="260" cy="85" rx="70" ry="35" fill="white" opacity="0.7"/>
  <ellipse cx="150" cy="110" rx="60" ry="30" fill="white" opacity="0.6"/>
  <ellipse cx="650" cy="140" rx="80" ry="35" fill="white" opacity="0.6"/>
  <ellipse cx="720" cy="125" rx="65" ry="30" fill="white" opacity="0.6"/>

  <!-- Horizon / Champs verts en arrière-plan -->
  <ellipse cx="600" cy="420" rx="700" ry="120" fill="#388E3C" opacity="0.5"/>

  <!-- Sillons du champ (rangées cultivées) -->
  <rect x="0" y="480" width="1200" height="320" fill="url(#soilGrad)"/>
  <!-- Rangées cultivées -->
  <rect x="0" y="500" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>
  <rect x="0" y="530" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>
  <rect x="0" y="560" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>
  <rect x="0" y="590" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>
  <rect x="0" y="620" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>
  <rect x="0" y="650" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>
  <rect x="0" y="680" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>
  <rect x="0" y="710" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>
  <rect x="0" y="740" width="1200" height="12" fill="#6D4C41" opacity="0.4"/>

  <!-- Prairie verte -->
  <ellipse cx="600" cy="485" rx="700" ry="80" fill="#4CAF50"/>
  <ellipse cx="600" cy="485" rx="600" ry="60" fill="#388E3C"/>

  <!-- Maïs / Cultures à gauche -->
  <g opacity="0.9">
    <rect x="80" y="370" width="18" height="100" fill="#2E7D32"/>
    <ellipse cx="89" cy="360" rx="22" ry="35" fill="#43A047"/>
    <rect x="140" y="350" width="18" height="120" fill="#2E7D32"/>
    <ellipse cx="149" cy="340" rx="22" ry="38" fill="#43A047"/>
    <rect x="200" y="365" width="18" height="105" fill="#2E7D32"/>
    <ellipse cx="209" cy="355" rx="22" ry="35" fill="#43A047"/>
    <rect x="260" y="355" width="18" height="115" fill="#2E7D32"/>
    <ellipse cx="269" cy="345" rx="22" ry="38" fill="#43A047"/>
    <rect x="320" y="370" width="18" height="100" fill="#2E7D32"/>
    <ellipse cx="329" cy="360" rx="22" ry="35" fill="#43A047"/>
  </g>

  <!-- Tracteur -->
  <g transform="translate(580, 390)">
    <!-- Corps principal -->
    <rect x="20" y="30" width="200" height="110" rx="10" fill="url(#tractorGrad)"/>
    <!-- Capot moteur -->
    <rect x="160" y="45" width="100" height="80" rx="8" fill="#D84315"/>
    <!-- Cabine vitrée -->
    <rect x="30" y="10" width="110" height="80" rx="8" fill="#E64A19"/>
    <rect x="40" y="18" width="90" height="62" rx="5" fill="#81D4FA" opacity="0.7"/>
    <!-- Tuyau d'échappement -->
    <rect x="240" y="20" width="12" height="40" rx="4" fill="#78909C"/>
    <ellipse cx="246" cy="18" rx="10" ry="6" fill="#546E7A"/>
    <!-- Fumée -->
    <ellipse cx="246" cy="8" rx="8" ry="5" fill="white" opacity="0.5"/>
    <ellipse cx="250" cy="-2" rx="10" ry="6" fill="white" opacity="0.3"/>
    <!-- Grande roue arrière -->
    <circle cx="60" cy="150" r="65" fill="#212121"/>
    <circle cx="60" cy="150" r="52" fill="#37474F"/>
    <circle cx="60" cy="150" r="15" fill="#616161"/>
    <!-- Petite roue avant -->
    <circle cx="220" cy="160" r="42" fill="#212121"/>
    <circle cx="220" cy="160" r="32" fill="#37474F"/>
    <circle cx="220" cy="160" r="10" fill="#616161"/>
    <!-- Outil agricole arrière -->
    <rect x="-40" y="100" width="65" height="12" rx="4" fill="#78909C"/>
    <rect x="-45" y="108" width="8" height="30" rx="2" fill="#607D8B"/>
    <rect x="-30" y="108" width="8" height="30" rx="2" fill="#607D8B"/>
    <rect x="-15" y="108" width="8" height="30" rx="2" fill="#607D8B"/>
    <rect x="0" y="108" width="8" height="30" rx="2" fill="#607D8B"/>
  </g>

  <!-- Bétail (vaches) à droite -->
  <g transform="translate(900, 420)" opacity="0.9">
    <!-- Vache 1 -->
    <ellipse cx="80" cy="60" rx="55" ry="32" fill="#EFEBE9"/>
    <ellipse cx="55" cy="42" rx="28" ry="22" fill="#EFEBE9"/><!-- tête -->
    <rect x="42" y="58" width="12" height="35" rx="4" fill="#EFEBE9"/><!-- patte -->
    <rect x="62" y="58" width="12" height="35" rx="4" fill="#EFEBE9"/>
    <rect x="90" y="58" width="12" height="35" rx="4" fill="#EFEBE9"/>
    <rect x="110" y="58" width="12" height="35" rx="4" fill="#EFEBE9"/>
    <ellipse cx="38" cy="42" rx="6" ry="4" fill="#BCAAA4"/><!-- oreille -->
    <!-- Taches -->
    <ellipse cx="85" cy="55" rx="18" ry="12" fill="#5D4037" opacity="0.5"/>
    <ellipse cx="65" cy="70" rx="10" ry="8" fill="#5D4037" opacity="0.4"/>
    <!-- Vache 2 plus petite -->
    <ellipse cx="180" cy="75" rx="42" ry="25" fill="#D7CCC8"/>
    <ellipse cx="158" cy="60" rx="22" ry="17" fill="#D7CCC8"/>
    <rect x="148" y="72" width="10" height="28" rx="3" fill="#D7CCC8"/>
    <rect x="165" y="72" width="10" height="28" rx="3" fill="#D7CCC8"/>
    <rect x="190" y="72" width="10" height="28" rx="3" fill="#D7CCC8"/>
    <rect x="207" y="72" width="10" height="28" rx="3" fill="#D7CCC8"/>
  </g>

  <!-- Arbre -->
  <rect x="1080" y="330" width="20" height="150" fill="#5D4037"/>
  <ellipse cx="1090" cy="310" rx="55" ry="65" fill="#2E7D32"/>
  <ellipse cx="1060" cy="330" rx="40" ry="50" fill="#388E3C"/>
  <ellipse cx="1120" cy="325" rx="38" ry="48" fill="#33691E"/>

  <!-- Texte de fond subtil -->
  <rect x="0" y="0" width="1200" height="800" fill="rgba(0,0,0,0.08)"/>
</svg>
